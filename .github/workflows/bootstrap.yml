name: Bootstrap production project

on:
  push:
    branches: [main]
    paths:
      - "bootstrap.part38"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct project
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap.part* | base64 -d | tar -xzf -
          rm bootstrap.part*
          rm .github/workflows/bootstrap.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "feat: deploy barber site with Supabase and Netlify"
          git push origin HEAD:main
