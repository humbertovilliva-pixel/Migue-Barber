name: Web build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://zphmjcguxlfqitnzobqc.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_8b-pRNULnCdqYDGGRdrJOw_RgwlM8-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web
        run: npm run build:web
